name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  model:
    name: model (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: model
      - run: pytest -q
        working-directory: model

  web:
    name: web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npm run build
        working-directory: web
