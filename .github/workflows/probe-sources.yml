name: Probe data sources

# Weekly, read-only. Asks each upstream source in data-pipeline/sources.json
# whether it has a newer version than the committed data, and whether it has
# stopped updating, with a HEAD request or one small GET. It opens an issue
# for each problem (never a second one for the same problem) and changes
# nothing in the repo. The rebuild that would act on a change is not built
# yet; see docs/plans/2026-09-23-automated-data-refresh.md, Phase 2.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the issues that would be opened instead of opening them"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: probe
        working-directory: data-pipeline
        # Exit 1 means a source could not be reached, which is reported as
        # an issue below and must not stop the other sources' results.
        shell: bash
        run: |
          set +e
          python probe_sources.py --json > probe.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat probe.json
          exit 0

      - name: Open issues for what needs attention
        working-directory: data-pipeline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          python probe_issues.py probe.json --exit-code "${{ steps.probe.outputs.code }}" $flag
